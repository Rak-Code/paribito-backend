spring.application.name=project

# ============================================================
# Spring Profile Configuration
# ============================================================
spring.profiles.active=default

# Groq API Configuration
groq.api.key=${GROQ_API_KEY}

# ============================================================
# MongoDB Configuration
# ============================================================
# SECURITY WARNING: Move credentials to environment variables in production
spring.data.mongodb.uri=${MONGODB_URI:mongodb+srv://testrakesh50_db_user:f4zU7M4LWxkVdDgX@paribitoclusterdb.xnuf4s3.mongodb.net/ecommerce_db?retryWrites=true&w=majority&maxPoolSize=50&minPoolSize=5&maxIdleTimeMS=300000&connectTimeoutMS=10000&socketTimeoutMS=10000&serverSelectionTimeoutMS=10000}

# Connection Timeout (how long to wait for connection)
